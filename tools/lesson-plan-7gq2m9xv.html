<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- 검색엔진 노출 방지 (비밀 페이지) -->
    <meta name="robots" content="noindex,nofollow,noarchive">
    <title>교안 자동 생성 · 윤정호</title>

    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css" />
    <link rel="stylesheet" href="/styles.css">

    <!-- PDF 텍스트 추출: 브라우저에서 처리(서버 업로드 없이). pdfjs-dist 자체 호스팅 -->
    <script src="/tools/vendor/pdfjs/pdf.min.js"></script>
    <script>
        if (window.pdfjsLib) {
            window.pdfjsLib.GlobalWorkerOptions.workerSrc = "/tools/vendor/pdfjs/pdf.worker.min.js";
        }
    </script>

    <style>
        /* 교안 생성 도구 전용 스타일 (홈페이지 디자인 토큰 재사용) */
        body { background: var(--color-bg-alt); }

        .tool-header {
            background: var(--color-primary);
            color: #fff;
            padding: 1rem 1.5rem;
            position: sticky; top: 0; z-index: 10;
            box-shadow: var(--shadow-md);
        }
        .tool-header a {
            color: #fff; text-decoration: none;
            display: inline-flex; align-items: baseline; gap: .55rem;
        }
        .tool-header .name { font-weight: 800; font-size: 1.15rem; letter-spacing: -.01em; }
        .tool-header .slogan { font-size: .82rem; color: #BBD0F0; }

        .tool-wrap { max-width: 860px; margin: 0 auto; padding: 2.5rem 1.25rem 5rem; }
        .tool-title { font-size: clamp(1.5rem, 4vw, 2rem); font-weight: 800; color: var(--color-primary); letter-spacing: -.02em; }
        .tool-lead { margin-top: .6rem; color: var(--color-text-secondary); line-height: 1.7; }

        .card {
            background: #fff; border: 1px solid var(--color-border);
            border-radius: var(--radius-lg); padding: 1.75rem;
            box-shadow: var(--shadow-sm); margin-top: 1.75rem;
        }

        /* 업로드 박스 */
        .dropzone {
            border: 2px dashed var(--color-border); border-radius: var(--radius-md);
            padding: 2.5rem 1.5rem; text-align: center; cursor: pointer;
            transition: var(--transition); background: var(--color-bg-alt);
        }
        .dropzone:hover, .dropzone.dragover {
            border-color: var(--color-accent); background: #F0FAF5;
        }
        .dropzone .big { font-weight: 700; color: var(--color-text); }
        .dropzone .small { margin-top: .4rem; font-size: .85rem; color: var(--color-text-muted); }
        .dropzone svg { width: 38px; height: 38px; color: var(--color-primary-light); margin-bottom: .75rem; }

        .file-list { list-style: none; margin: 1rem 0 0; padding: 0; }
        .file-list li {
            display: flex; align-items: center; gap: .75rem;
            padding: .7rem .9rem; border: 1px solid var(--color-border-light);
            border-radius: var(--radius-sm); margin-top: .55rem; background: #fff;
        }
        .file-list .fname { flex: 1; font-weight: 600; font-size: .92rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .file-list .fsize { font-size: .8rem; color: var(--color-text-muted); white-space: nowrap; }
        .file-list .fdel {
            border: none; background: var(--color-border-light); color: var(--color-text-secondary);
            width: 26px; height: 26px; border-radius: 50%; cursor: pointer; font-size: 1rem; line-height: 1;
        }
        .file-list .fdel:hover { background: #FED7D7; color: #C53030; }

        .btn-generate {
            display: block; width: 100%; margin-top: 1.5rem;
            background: var(--color-accent); color: #fff; border: none;
            padding: 1rem; font-size: 1.05rem; font-weight: 800; letter-spacing: -.01em;
            border-radius: var(--radius-md); cursor: pointer; transition: var(--transition);
            font-family: var(--font-base);
        }
        .btn-generate:hover:not(:disabled) { background: var(--color-accent-light); transform: translateY(-1px); }
        .btn-generate:disabled { opacity: .55; cursor: not-allowed; }

        .status { margin-top: 1.25rem; font-size: .92rem; min-height: 1.4em; }
        .status.err { color: #C53030; }
        .status.ok { color: var(--color-accent); }
        .spinner {
            display: inline-block; width: 16px; height: 16px; vertical-align: -3px; margin-right: .5rem;
            border: 2px solid var(--color-border); border-top-color: var(--color-primary);
            border-radius: 50%; animation: spin .8s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        .result-head { display: flex; align-items: center; justify-content: space-between; gap: 1rem; }
        .result-head h2 { font-size: 1.15rem; color: var(--color-primary); }
        .btn-copy {
            border: 1px solid var(--color-primary-light); background: #fff; color: var(--color-primary);
            padding: .45rem .9rem; border-radius: var(--radius-sm); cursor: pointer; font-weight: 700; font-size: .85rem;
            font-family: var(--font-base);
        }
        .btn-copy:hover { background: var(--color-primary); color: #fff; }
        .result-body {
            margin-top: 1rem; white-space: pre-wrap; word-break: break-word; line-height: 1.75;
            color: var(--color-text); max-height: 60vh; overflow-y: auto;
            background: var(--color-bg-alt); border: 1px solid var(--color-border-light);
            border-radius: var(--radius-md); padding: 1.25rem; font-size: .95rem;
        }
        .hidden { display: none; }
    </style>
</head>
<body>
    <header class="tool-header">
        <a href="/" title="홈으로">
            <span class="name">윤정호</span>
            <span class="slogan">36년 자동차 엔지니어가 전하는 현장형 AI 교육</span>
        </a>
    </header>

    <main class="tool-wrap">
        <h1 class="tool-title">교안 자동 생성</h1>
        <p class="tool-lead">강의 자료(PDF · Word · TXT)를 업로드하면 AI가 내용을 종합해 교안을 자동으로 만들어 줍니다.<br>관련된 자료 <strong>3~5개</strong>를 함께 올리면 가장 좋은 결과가 나옵니다.<br><span style="font-size:.88rem;color:var(--color-text-muted)">PDF는 브라우저에서 <strong>텍스트만 자동 추출</strong>해 올리므로 용량이 큰 PDF(최대 50MB)도 사용할 수 있습니다.</span></p>

        <section class="card">
            <div id="dropzone" class="dropzone" role="button" tabindex="0">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/>
                </svg>
                <div class="big">파일을 끌어 놓거나 클릭하여 선택</div>
                <div class="small">PDF 최대 50MB(텍스트 자동 추출) · Word·TXT 최대 4.5MB · 최대 5개</div>
                <input id="fileInput" type="file" accept=".pdf,.doc,.docx,.txt" multiple class="hidden">
            </div>

            <ul id="fileList" class="file-list"></ul>

            <button id="btnGenerate" class="btn-generate" disabled>교안 생성</button>
            <button id="btnPdfPpt" class="btn-generate" style="margin-top:.7rem;background:var(--color-primary)" disabled>📄 PDF 내용으로 PPT 바로 만들기</button>
            <div id="status" class="status" aria-live="polite"></div>
        </section>

        <section id="resultCard" class="card hidden">
            <div class="result-head">
                <h2>생성된 교안</h2>
                <div style="display:flex;gap:.5rem;flex-wrap:wrap">
                    <button id="btnPpt" class="btn-copy" style="background:var(--color-accent);color:#fff;border-color:var(--color-accent)">📊 PPT 다운로드</button>
                    <button id="btnCopy" class="btn-copy">복사</button>
                </div>
            </div>
            <div id="resultBody" class="result-body"></div>
        </section>
    </main>

    <script>
    (function () {
        // 비밀 페이지 토큰 — Vercel 환경변수 ACCESS_TOKEN 과 동일한 값으로 맞춰주세요.
        var ACCESS_TOKEN = "axtok_d3f8k1m6";

        var MAX_FILES = 5;
        var MAX_SIZE = 4.5 * 1024 * 1024; // Word·TXT: Vercel 함수 요청 한도(4.5MB)로 그대로 업로드
        var PDF_MAX_SIZE = 50 * 1024 * 1024; // PDF: 브라우저에서 텍스트만 추출하므로 크게 허용
        var ALLOWED = /\.(pdf|docx?|txt)$/i;

        var dropzone = document.getElementById("dropzone");
        var fileInput = document.getElementById("fileInput");
        var fileListEl = document.getElementById("fileList");
        var btnGenerate = document.getElementById("btnGenerate");
        var statusEl = document.getElementById("status");
        var resultCard = document.getElementById("resultCard");
        var resultBody = document.getElementById("resultBody");
        var btnCopy = document.getElementById("btnCopy");
        var btnPpt = document.getElementById("btnPpt");
        var btnPdfPpt = document.getElementById("btnPdfPpt");

        // 각 항목: { file, isPdf, text, state }   state: extracting | ready | empty | error
        var items = [];

        function pdfReadyCount() { return items.filter(function (it) { return it.isPdf && it.state === "ready"; }).length; }
        function anyExtracting() { return items.some(function (it) { return it.state === "extracting"; }); }

        function fmtSize(n) {
            if (n < 1024) return n + " B";
            if (n < 1024 * 1024) return (n / 1024).toFixed(0) + " KB";
            return (n / 1024 / 1024).toFixed(2) + " MB";
        }

        function setStatus(msg, kind) {
            statusEl.className = "status" + (kind ? " " + kind : "");
            statusEl.innerHTML = msg || "";
        }

        function stateLabel(it) {
            if (!it.isPdf) return "";
            if (it.state === "extracting") return "텍스트 추출 중…";
            if (it.state === "ready") return "추출 완료 · " + it.text.length.toLocaleString() + "자";
            if (it.state === "empty") return "텍스트 없음(스캔본?)";
            if (it.state === "error") return "추출 실패";
            return "";
        }

        function render() {
            fileListEl.innerHTML = "";
            items.forEach(function (it, i) {
                var li = document.createElement("li");
                var name = document.createElement("span"); name.className = "fname"; name.textContent = it.file.name;
                var size = document.createElement("span"); size.className = "fsize";
                var lab = stateLabel(it);
                size.textContent = fmtSize(it.file.size) + (lab ? " · " + lab : "");
                if (it.state === "error" || it.state === "empty") size.style.color = "#C53030";
                var del = document.createElement("button"); del.className = "fdel"; del.type = "button"; del.textContent = "×"; del.title = "삭제";
                del.onclick = function () { items.splice(i, 1); render(); };
                li.appendChild(name); li.appendChild(size); li.appendChild(del);
                fileListEl.appendChild(li);
            });
            btnGenerate.disabled = items.length === 0 || anyExtracting();
            btnPdfPpt.disabled = pdfReadyCount() === 0 || anyExtracting();
        }

        // 브라우저에서 PDF 전체 페이지의 텍스트를 추출 (서버 전송 없음)
        function extractPdfText(file) {
            if (!window.pdfjsLib) return Promise.reject(new Error("PDF 모듈 로드 실패 — 새로고침 후 다시 시도하세요."));
            return file.arrayBuffer().then(function (buf) {
                return window.pdfjsLib.getDocument({ data: new Uint8Array(buf) }).promise;
            }).then(function (pdf) {
                var pages = [];
                var seq = Promise.resolve();
                for (var p = 1; p <= pdf.numPages; p++) {
                    (function (n) {
                        seq = seq.then(function () {
                            return pdf.getPage(n)
                                .then(function (page) { return page.getTextContent(); })
                                .then(function (tc) {
                                    // hasEOL 로 줄바꿈을 보존해야 제목/불릿 구조가 살아 PPT가 깔끔해짐
                                    var lineBuf = "", lines = [];
                                    tc.items.forEach(function (t) {
                                        lineBuf += t.str;
                                        if (t.hasEOL) { if (lineBuf.trim()) lines.push(lineBuf.trim()); lineBuf = ""; }
                                    });
                                    if (lineBuf.trim()) lines.push(lineBuf.trim());
                                    pages.push(lines.join("\n"));
                                });
                        });
                    })(p);
                }
                return seq.then(function () {
                    return pages.join("\n\n").replace(/[ \t]+/g, " ").replace(/\n{3,}/g, "\n\n").trim();
                });
            });
        }

        function addFiles(fileList) {
            var rejected = [];
            Array.prototype.forEach.call(fileList, function (f) {
                if (!ALLOWED.test(f.name)) { rejected.push(f.name + " (형식)"); return; }
                var isPdf = /\.pdf$/i.test(f.name);
                var limit = isPdf ? PDF_MAX_SIZE : MAX_SIZE;
                if (f.size > limit) { rejected.push(f.name + (isPdf ? " (50MB 초과)" : " (4.5MB 초과)")); return; }
                if (items.length >= MAX_FILES) { rejected.push(f.name + " (최대 5개)"); return; }
                if (items.some(function (x) { return x.file.name === f.name && x.file.size === f.size; })) return;
                var it = { file: f, isPdf: isPdf, text: null, state: isPdf ? "extracting" : "ready" };
                items.push(it);
                if (isPdf) {
                    extractPdfText(f).then(function (text) {
                        it.text = text;
                        it.state = (text && text.length >= 20) ? "ready" : "empty";
                        render();
                    }).catch(function () { it.state = "error"; render(); });
                }
            });
            render();
            if (rejected.length) setStatus("제외된 파일: " + rejected.join(", "), "err");
            else setStatus("");
        }

        dropzone.addEventListener("click", function () { fileInput.click(); });
        dropzone.addEventListener("keydown", function (e) { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); fileInput.click(); } });
        fileInput.addEventListener("change", function () { addFiles(fileInput.files); fileInput.value = ""; });

        ["dragenter", "dragover"].forEach(function (ev) {
            dropzone.addEventListener(ev, function (e) { e.preventDefault(); dropzone.classList.add("dragover"); });
        });
        ["dragleave", "drop"].forEach(function (ev) {
            dropzone.addEventListener(ev, function (e) { e.preventDefault(); dropzone.classList.remove("dragover"); });
        });
        dropzone.addEventListener("drop", function (e) {
            if (e.dataTransfer && e.dataTransfer.files) addFiles(e.dataTransfer.files);
        });

        // 서버 업로드: PDF는 추출 텍스트(.txt)로, 나머지는 원본 그대로 → Dify 용량 제한 우회
        function uploadItem(it) {
            var blob, filename, mime;
            if (it.isPdf) {
                blob = new Blob([it.text || ""], { type: "text/plain" });
                filename = it.file.name.replace(/\.pdf$/i, "") + ".txt";
                mime = "text/plain";
            } else {
                blob = it.file; filename = it.file.name; mime = it.file.type || "application/octet-stream";
            }
            return fetch("/api/upload", {
                method: "POST",
                headers: {
                    "Content-Type": "application/octet-stream",
                    "x-access-token": ACCESS_TOKEN,
                    "x-filename": encodeURIComponent(filename),
                    "x-filemime": mime
                },
                body: blob
            }).then(function (r) {
                return r.json().then(function (j) {
                    if (!r.ok) throw new Error(j.error || ("업로드 실패 (" + r.status + ")"));
                    return j.id;
                });
            });
        }

        btnGenerate.addEventListener("click", function () {
            if (items.length === 0) return;
            var bad = items.filter(function (it) { return it.isPdf && it.state !== "ready"; });
            if (bad.length) { setStatus("PDF 텍스트 추출이 끝나지 않았거나 실패했습니다: " + bad.map(function (b) { return b.file.name; }).join(", "), "err"); return; }
            btnGenerate.disabled = true; btnPdfPpt.disabled = true;
            resultCard.classList.add("hidden");

            var ids = [];
            var chain = Promise.resolve();
            items.forEach(function (it, i) {
                chain = chain.then(function () {
                    setStatus('<span class="spinner"></span>문서 업로드 중… (' + (i + 1) + '/' + items.length + ') ' + it.file.name);
                    return uploadItem(it).then(function (id) { ids.push(id); });
                });
            });

            chain.then(function () {
                setStatus('<span class="spinner"></span>교안 생성 중… 자료 양에 따라 30초~2분 정도 걸릴 수 있습니다.');
                return fetch("/api/generate", {
                    method: "POST",
                    headers: { "Content-Type": "application/json", "x-access-token": ACCESS_TOKEN },
                    body: JSON.stringify({ fileIds: ids, url: "" })
                });
            }).then(function (r) {
                return r.json().then(function (j) {
                    if (!r.ok) throw new Error(j.error || ("생성 실패 (" + r.status + ")"));
                    return j.result;
                });
            }).then(function (result) {
                resultBody.textContent = result;
                resultCard.classList.remove("hidden");
                setStatus("교안 생성이 완료되었습니다.", "ok");
                resultCard.scrollIntoView({ behavior: "smooth", block: "start" });
            }).catch(function (err) {
                setStatus("오류: " + (err && err.message ? err.message : err), "err");
            }).then(function () { render(); });
        });

        btnCopy.addEventListener("click", function () {
            var text = resultBody.textContent || "";
            navigator.clipboard.writeText(text).then(function () {
                btnCopy.textContent = "복사됨!";
                setTimeout(function () { btnCopy.textContent = "복사"; }, 1500);
            }).catch(function () {
                btnCopy.textContent = "복사 실패";
                setTimeout(function () { btnCopy.textContent = "복사"; }, 1500);
            });
        });

        // 텍스트 → /api/ppt → .pptx 다운로드 (공통)
        function requestPpt(text, name, btn) {
            if (!text || !text.trim()) { setStatus("PPT로 만들 텍스트가 없습니다.", "err"); return; }
            var orig = btn.textContent;
            btn.disabled = true; btn.textContent = "⏳ 생성 중…";
            fetch("/api/ppt", {
                method: "POST",
                headers: { "Content-Type": "application/json", "x-access-token": ACCESS_TOKEN },
                body: JSON.stringify({ text: text, filename: name })
            }).then(function (r) {
                if (!r.ok) return r.json().then(function (j) { throw new Error(j.error || ("PPT 실패 (" + r.status + ")")); });
                return r.blob();
            }).then(function (blob) {
                var url = URL.createObjectURL(blob);
                var a = document.createElement("a");
                a.href = url;
                a.download = name.replace(/\.[^.]+$/, "").replace(/^\d{10,}_/, "").replace(/_교안$/, "") + "_발표자료.pptx";
                document.body.appendChild(a); a.click(); a.remove();
                URL.revokeObjectURL(url);
                btn.textContent = "✓ 다운로드됨";
                setTimeout(function () { btn.textContent = orig; btn.disabled = false; render(); }, 2000);
            }).catch(function (err) {
                btn.textContent = "✗ 실패";
                setStatus("PPT 오류: " + (err && err.message ? err.message : err), "err");
                setTimeout(function () { btn.textContent = orig; btn.disabled = false; render(); }, 2000);
            });
        }

        // 생성된 교안 텍스트 → PPT (기존)
        btnPpt.addEventListener("click", function () {
            var name = items.length ? items[0].file.name : "교안";
            requestPpt(resultBody.textContent || "", name, btnPpt);
        });

        // 추출된 PDF 텍스트 → /api/ppt 바로 (신규, 대용량 PDF 대응)
        btnPdfPpt.addEventListener("click", function () {
            var ready = items.filter(function (it) { return it.isPdf && it.state === "ready"; });
            if (!ready.length) { setStatus("추출된 PDF 텍스트가 없습니다.", "err"); return; }
            var combined = ready.map(function (it) {
                return "# " + it.file.name.replace(/\.pdf$/i, "") + "\n\n" + it.text;
            }).join("\n\n");
            requestPpt(combined, ready[0].file.name, btnPdfPpt);
        });
    })();
    </script>
</body>
</html>
