<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Slate — Website</title>
<link rel="stylesheet" href="styles.css">
<link rel="stylesheet" href="shop.css">
</head>
<body>
<div class="site">

  <!-- Header -->
  <header class="site-header">
    <div class="site-header__inner">
      <div class="site-logo" data-nav="home">SLATE</div>
      <nav class="site-nav" id="siteNav"></nav>
      <div class="site-header__icons">
        <button class="icon-btn" id="searchToggle" aria-label="검색">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        </button>
        <button class="icon-btn" aria-label="위시리스트">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>
        </button>
        <button class="icon-btn" aria-label="장바구니">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/><path d="M16 10a4 4 0 0 1-8 0"/></svg>
          <span class="cart-badge" id="cartBadge" hidden>0</span>
        </button>
      </div>
    </div>
    <div class="search-bar" id="searchBar" hidden>
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      <input type="text" placeholder="브랜드, 소재, 컬러로 검색" />
    </div>
  </header>

  <!-- HOME -->
  <div data-page="home" class="is-shown">
    <section class="hero">
      <div class="hero__left">
        <span class="hero__label">SS 2026 Collection</span>
        <h1 class="hero__title">New<br><em>Season.</em></h1>
        <button class="hero__cta" data-nav="women">컬렉션 보기
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>
        </button>
      </div>
      <div class="hero__right">
        <div class="hero__img"><span>Product Image</span></div>
        <div class="hero__scroll">Scroll →</div>
      </div>
    </section>

    <section class="grid-section">
      <div class="grid-section__top">
        <span class="grid-section__heading">이번 주 신상</span>
        <div class="grid-tabs" data-tabs="home"></div>
      </div>
      <div class="product-grid" data-grid="home"></div>
    </section>
  </div>

  <!-- CATEGORY (PLP) -->
  <div data-page="plp">
    <div class="plp-head">
      <span class="plp-head__eyebrow" data-plp-eyebrow></span>
      <h1 class="plp-head__title" data-plp-title></h1>
    </div>
    <section class="grid-section">
      <div class="grid-section__top">
        <span class="grid-section__heading">전체 상품</span>
        <div class="grid-tabs" data-tabs="plp"></div>
      </div>
      <div class="product-grid" data-grid="plp"></div>
    </section>
  </div>

  <!-- PRODUCT DETAIL (PDP) -->
  <div data-page="pdp"></div>

  <!-- Footer -->
  <footer class="site-footer" id="siteFooter"></footer>
</div>

<script src="site.js"></script>
</body>
</html>
