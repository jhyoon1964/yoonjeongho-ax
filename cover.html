<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI 격차 — 표지</title>
<style>
  :root{
    --cyan:#39d8ff;
    --blue:#3b82f6;
    --violet:#8b5cf6;
    --gold:#ffd25e;
    --cream:#f3f6ff;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{background:#05070f;}
  .book{
    width:700px;height:1000px;margin:0 auto;position:relative;overflow:hidden;
    font-family:'Pretendard','Malgun Gothic','맑은 고딕',sans-serif;
    color:var(--cream);
    background:
      radial-gradient(120% 90% at 50% 38%, rgba(59,130,246,.30), transparent 55%),
      radial-gradient(90% 60% at 80% 10%, rgba(139,92,246,.22), transparent 60%),
      radial-gradient(80% 60% at 12% 85%, rgba(57,216,255,.16), transparent 60%),
      linear-gradient(180deg,#0a1124 0%,#070b18 50%,#05060d 100%);
    box-shadow:0 30px 90px rgba(0,0,0,.6);
  }
  /* 별/입자 레이어 */
  .stars{position:absolute;inset:0;
    background-image:
      radial-gradient(1.5px 1.5px at 12% 18%, rgba(255,255,255,.9), transparent),
      radial-gradient(1.2px 1.2px at 28% 9%, rgba(160,210,255,.8), transparent),
      radial-gradient(1.6px 1.6px at 67% 14%, rgba(255,255,255,.7), transparent),
      radial-gradient(1.2px 1.2px at 84% 26%, rgba(120,200,255,.8), transparent),
      radial-gradient(1.4px 1.4px at 8% 55%, rgba(255,255,255,.6), transparent),
      radial-gradient(1.3px 1.3px at 92% 60%, rgba(170,220,255,.7), transparent),
      radial-gradient(1.5px 1.5px at 20% 72%, rgba(255,255,255,.6), transparent),
      radial-gradient(1.2px 1.2px at 74% 78%, rgba(140,200,255,.7), transparent),
      radial-gradient(1.4px 1.4px at 46% 90%, rgba(255,255,255,.5), transparent),
      radial-gradient(1.3px 1.3px at 58% 33%, rgba(200,230,255,.7), transparent);
  }
  /* 그래픽 SVG */
  .hero{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
    width:760px;height:760px;z-index:1;opacity:.95;}

  .layer{position:relative;z-index:3;height:100%;display:flex;flex-direction:column;padding:54px 54px 0;}

  /* 상단 */
  .top{display:flex;justify-content:space-between;align-items:flex-start;gap:20px;}
  .brand{font-size:18px;font-weight:700;letter-spacing:1px;color:#bcd4ff;}
  .brand .dot{color:var(--cyan);}
  .subt{max-width:330px;text-align:right;font-size:16px;line-height:1.55;
    color:#aebfe0;font-weight:500;}
  .subt b{color:#eaf2ff;}

  /* 타이틀 영역 (가운데) */
  .hero-wrap{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
    position:relative;}
  .eyebrow{
    display:inline-flex;align-items:center;gap:9px;
    border:1px solid rgba(57,216,255,.5);border-radius:999px;
    padding:8px 20px;font-size:16px;color:#cdeeff;letter-spacing:1px;
    background:rgba(57,216,255,.07);backdrop-filter:blur(4px);
    box-shadow:0 0 24px rgba(57,216,255,.25) inset;
  }
  .eyebrow .led{width:8px;height:8px;border-radius:50%;background:var(--cyan);
    box-shadow:0 0 12px var(--cyan),0 0 24px var(--cyan);}

  .title{margin-top:28px;text-align:center;line-height:.96;position:relative;}
  /* 제목 가독성용 어두운 스크림 — 밝은 코어 위에서 글자 분리 */
  .title::before{
    content:"";position:absolute;left:50%;top:48%;transform:translate(-50%,-50%);
    width:560px;height:600px;z-index:-1;pointer-events:none;
    background:radial-gradient(56% 50% at 50% 50%,
      rgba(3,7,20,.78) 0%,rgba(3,7,20,.55) 48%,rgba(3,7,20,.22) 68%,transparent 80%);
    filter:blur(10px);
  }
  .title .ai{
    font-size:230px;font-weight:900;letter-spacing:-6px;
    background:linear-gradient(180deg,#ffffff 0%,#bfe6ff 45%,#4cc6ff 100%);
    -webkit-background-clip:text;background-clip:text;color:transparent;
    filter:drop-shadow(0 3px 14px rgba(0,6,20,.9))
           drop-shadow(0 0 40px rgba(76,198,255,.65))
           drop-shadow(0 0 90px rgba(59,130,246,.5));
    display:block;
  }
  .title .kr{
    font-size:118px;font-weight:900;letter-spacing:-2px;color:#f4f8ff;
    -webkit-text-stroke:1px rgba(8,16,34,.55);
    text-shadow:
      0 2px 16px rgba(2,6,18,.92),
      0 0 6px rgba(2,6,18,.85),
      0 0 32px rgba(120,170,255,.45);
    margin-top:-6px;display:block;
  }
  .with{margin-top:30px;font-size:26px;font-weight:700;color:#cfe0ff;letter-spacing:.5px;}
  .with b{color:var(--cyan);}

  /* 하단 정보 패널 */
  .panel{
    margin:0 -54px;padding:34px 54px 30px;
    background:linear-gradient(180deg,rgba(8,14,30,0) 0%,rgba(7,11,24,.85) 30%,rgba(5,8,18,.96) 100%);
    border-top:1px solid rgba(120,170,255,.18);
  }
  .pitch{font-size:27px;font-weight:800;text-align:center;color:var(--gold);
    line-height:1.45;text-shadow:0 0 24px rgba(255,210,94,.35);}
  .pdesc{margin-top:14px;text-align:center;font-size:16px;color:#aebfe0;line-height:1.65;}
  .meta{margin-top:26px;display:flex;justify-content:space-between;align-items:flex-end;}
  .author .nm{font-size:24px;font-weight:800;color:#eef4ff;}
  .author .nm .leaf{color:#34d399;}
  .author .ro{font-size:14px;color:#92a6cc;margin-top:5px;}
  .pub{font-size:15px;font-weight:800;letter-spacing:2px;color:#7e93bd;text-align:right;}
  .chips{margin-top:18px;text-align:center;}
  .chips span{display:inline-block;margin:4px 5px;padding:5px 13px;border-radius:999px;
    font-size:13px;font-weight:700;color:#bfe6ff;
    border:1px solid rgba(57,216,255,.3);background:rgba(57,216,255,.06);}
</style>
</head>
<body>
  <div class="book">
    <div class="stars"></div>

    <svg class="hero" viewBox="0 0 760 760" fill="none" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <radialGradient id="core" cx="50%" cy="50%" r="50%">
          <stop offset="0%" stop-color="#bff0ff" stop-opacity="1"/>
          <stop offset="35%" stop-color="#3bc4ff" stop-opacity=".9"/>
          <stop offset="70%" stop-color="#2f6dff" stop-opacity=".25"/>
          <stop offset="100%" stop-color="#2f6dff" stop-opacity="0"/>
        </radialGradient>
        <radialGradient id="halo" cx="50%" cy="50%" r="50%">
          <stop offset="0%" stop-color="#3b82f6" stop-opacity=".40"/>
          <stop offset="100%" stop-color="#3b82f6" stop-opacity="0"/>
        </radialGradient>
        <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
          <feGaussianBlur stdDeviation="6" result="b"/>
          <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
        </filter>
      </defs>

      <!-- 후광 -->
      <circle cx="380" cy="380" r="360" fill="url(#halo)"/>

      <!-- 광선 -->
      <g stroke="url(#core)" stroke-width="1.4" opacity=".5" filter="url(#glow)">
        <line x1="380" y1="380" x2="380" y2="20"/>
        <line x1="380" y1="380" x2="700" y2="120"/>
        <line x1="380" y1="380" x2="740" y2="420"/>
        <line x1="380" y1="380" x2="610" y2="700"/>
        <line x1="380" y1="380" x2="240" y2="730"/>
        <line x1="380" y1="380" x2="40" y2="520"/>
        <line x1="380" y1="380" x2="60" y2="180"/>
        <line x1="380" y1="380" x2="170" y2="40"/>
      </g>

      <!-- 궤도 링 -->
      <g stroke="#5b9bff" fill="none" opacity=".35">
        <ellipse cx="380" cy="380" rx="250" ry="250" stroke-width="1"/>
        <ellipse cx="380" cy="380" rx="250" ry="96" stroke-width="1"/>
        <ellipse cx="380" cy="380" rx="96" ry="250" stroke-width="1"/>
        <ellipse cx="380" cy="380" rx="320" ry="320" stroke-width=".7" opacity=".5"/>
      </g>

      <!-- 네트워크 노드 연결선 -->
      <g stroke="#6cc6ff" stroke-width="1.2" opacity=".55" filter="url(#glow)">
        <line x1="380" y1="380" x2="380" y2="130"/>
        <line x1="380" y1="380" x2="610" y2="250"/>
        <line x1="380" y1="380" x2="628" y2="470"/>
        <line x1="380" y1="380" x2="470" y2="628"/>
        <line x1="380" y1="380" x2="210" y2="600"/>
        <line x1="380" y1="380" x2="132" y2="390"/>
        <line x1="380" y1="380" x2="190" y2="180"/>
        <line x1="610" y1="250" x2="628" y2="470"/>
        <line x1="190" y1="180" x2="132" y2="390"/>
      </g>

      <!-- 외곽 노드 -->
      <g filter="url(#glow)">
        <g fill="#9fe2ff">
          <circle cx="380" cy="130" r="7"/>
          <circle cx="610" cy="250" r="9"/>
          <circle cx="628" cy="470" r="6"/>
          <circle cx="470" cy="628" r="8"/>
          <circle cx="210" cy="600" r="6"/>
          <circle cx="132" cy="390" r="9"/>
          <circle cx="190" cy="180" r="7"/>
        </g>
        <g fill="#dff4ff" opacity=".9">
          <circle cx="380" cy="130" r="3"/>
          <circle cx="610" cy="250" r="3.5"/>
          <circle cx="470" cy="628" r="3.2"/>
          <circle cx="132" cy="390" r="3.5"/>
        </g>
      </g>

      <!-- 중심 코어 -->
      <circle cx="380" cy="380" r="120" fill="url(#core)" filter="url(#glow)"/>
      <circle cx="380" cy="380" r="34" fill="#eafaff" filter="url(#glow)"/>
    </svg>

    <div class="layer">
      <div class="top">
        <div class="brand">AX LECTURER<span class="dot"> ·</span> 윤정호</div>
        <div class="subt">현대차 36년 엔지니어가 풀어내는,<br><b>새로운 동료 AI 에이전트와 일하는 법</b></div>
      </div>

      <div class="hero-wrap">
        <span class="eyebrow"><span class="led"></span> 누구나 지금 시작하는 실전 AI</span>
        <div class="title">
          <span class="ai">AI</span>
          <span class="kr">격차</span>
        </div>
        <div class="with">with <b>에이전트 군단</b></div>
      </div>

      <div class="panel">
        <div class="pitch">아는 것이 아니라, 실행이 격차를 만든다</div>
        <div class="pdesc">폴더 정리와 생각의 구조화부터 에이전트 군단을 부리는 법까지 —<br>회사를 넘어 산업을 바꾸는 새로운 산업혁명의 한복판으로</div>
        <div class="chips">
          <span>AI 에이전트</span><span>생각의 구조화</span><span>업무 자동화</span>
          <span>에이전트 군단</span><span>실행력 격차</span><span>새로운 산업혁명</span>
        </div>
        <div class="meta">
          <div class="author">
            <div class="nm"><span class="leaf">🌱</span> 윤정호 지음</div>
            <div class="ro">前 현대자동차 책임연구원 · AX Lecturer</div>
          </div>
          <div class="pub">AX BOOKS</div>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
